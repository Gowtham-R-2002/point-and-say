# Point & Say UI — Nginx Reverse Proxy
# Routes all traffic through port 80:
#   /           → Vite dev server (frontend + HMR)
#   /api/*      → FastAPI backend
#   /health     → FastAPI health check

server {
    listen 80;
    server_name _;

    # Increase timeouts for long-running AI requests
    proxy_connect_timeout 120s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Backend API — FastAPI on port 8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Codegen can take 30-60s with Nova Premier
        proxy_read_timeout 120s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # Frontend — Vite dev server with WebSocket support for HMR
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
